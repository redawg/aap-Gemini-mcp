<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AAP MCP Sandbox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --panel-2: #222c38;
      --ink: #f2f4f7;
      --muted: #9aa7b5;
      --line: #2e3a48;
      --accent: #ee0000;
      --accent-2: #f0f0f0;
      --ok: #3d9a5f;
      --warn: #c58b2d;
      --radius: 10px;
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(1200px 600px at 10% -10%, #2a1520 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #132033 0%, transparent 50%),
        var(--bg);
      color: var(--ink);
      font-family: var(--font);
    }
    body {
      display: grid;
      place-items: stretch;
      min-height: 100vh;
    }
    .shell {
      width: min(960px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      backdrop-filter: blur(8px);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      flex-direction: column;
      gap: .15rem;
    }
    .brand strong {
      font-size: 1.05rem;
      letter-spacing: .01em;
    }
    .brand span {
      color: var(--muted);
      font-size: .85rem;
    }
    .meta {
      display: flex;
      align-items: center;
      gap: .6rem;
      color: var(--muted);
      font-size: .85rem;
    }
    button, .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink);
      border-radius: 999px;
      padding: .45rem .9rem;
      font: 500 .9rem var(--font);
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 70%, #000);
      color: #fff;
    }
    button:disabled {
      opacity: .55;
      cursor: wait;
    }
    #login {
      display: none;
      place-items: center;
      padding: 2rem 1.25rem;
    }
    #login.show { display: grid; }
    .card {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      padding: 1.5rem;
      display: grid;
      gap: 1rem;
    }
    .card h1 {
      margin: 0;
      font-size: 1.35rem;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }
    label {
      display: grid;
      gap: .4rem;
      font-size: .9rem;
      color: var(--muted);
    }
    input[type="password"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      border-radius: 8px;
      padding: .7rem .8rem;
      font: 400 1rem var(--font);
    }
    #chat {
      display: none;
      grid-template-rows: 1fr auto;
      min-height: 0;
    }
    #chat.show { display: grid; }
    #messages {
      overflow: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: .9rem;
    }
    .msg {
      max-width: 85%;
      padding: .85rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: .95rem;
    }
    .msg.user {
      align-self: flex-end;
      background: #243041;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #182029;
    }
    .msg .tools {
      margin-top: .65rem;
      padding-top: .65rem;
      border-top: 1px dashed var(--line);
      color: var(--muted);
      font-family: var(--mono);
      font-size: .75rem;
    }
    .composer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .6rem;
      padding: 1rem 1.25rem 1.25rem;
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 92%, #000);
    }
    textarea {
      min-height: 52px;
      max-height: 160px;
      resize: vertical;
    }
    .error {
      color: #ffb4b4;
      font-size: .9rem;
    }
    .hints {
      display: flex;
      flex-direction: column;
      gap: .55rem;
      padding: 0 1.25rem .85rem;
      border-top: 1px solid transparent;
    }
    .hints-label {
      color: var(--muted);
      font-size: .8rem;
      letter-spacing: .02em;
    }
    .hint-row {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      align-items: center;
    }
    .hint-row .tag {
      font-size: .72rem;
      color: var(--muted);
      min-width: 3.2rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .hints button {
      font-size: .8rem;
      padding: .3rem .7rem;
      color: var(--muted);
    }
    .hints button:hover {
      color: var(--ink);
      border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
    }
    .welcome-starters {
      align-self: flex-start;
      max-width: 100%;
      background: #182029;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: .85rem 1rem;
      display: grid;
      gap: .55rem;
    }
    .welcome-starters p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.4;
    }
    .welcome-starters ol {
      margin: 0;
      padding-left: 1.15rem;
      display: grid;
      gap: .35rem;
      font-size: .88rem;
      color: var(--ink);
    }
    .welcome-starters button.linkish {
      all: unset;
      cursor: pointer;
      color: color-mix(in srgb, var(--ink) 85%, var(--accent));
      text-decoration: underline;
      text-underline-offset: 2px;
      font: inherit;
    }
    .welcome-starters button.linkish:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <strong>AAP MCP Sandbox</strong>
        <span>Gemini chat with AAP MCP, Google Search, and code tools</span>
      </div>
      <div class="meta">
        <span id="who"></span>
        <button id="resetBtn" type="button" hidden>Reset chat</button>
        <button id="logoutBtn" type="button" hidden>Log out</button>
      </div>
    </header>

    <section id="login">
      <form class="card" id="loginForm">
        <h1>Sign in</h1>
        <p>Workshop sandbox for chatting with Gemini while it calls live AAP MCP tools (jobs, inventory, monitoring, and more).</p>
        <label>
          Sandbox password
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="primary" type="submit">Enter sandbox</button>
        <div class="error" id="loginError" hidden></div>
      </form>
    </section>

    <section id="chat">
      <div id="messages"></div>
      <div class="hints" aria-label="Starter questions">
        <div class="hints-label">Starter questions — click to send</div>
        <div class="hint-row">
          <span class="tag">Read</span>
          <button type="button" data-q="What AAP MCP tools do you have, and name five that can create or change something?">Tools overview</button>
          <button type="button" data-q="List job templates by name.">Job templates</button>
          <button type="button" data-q="List inventories and how many hosts each has.">Inventories</button>
          <button type="button" data-q="List projects and organizations.">Projects / orgs</button>
          <button type="button" data-q="List execution environments.">Execution envs</button>
          <button type="button" data-q="Show recent jobs and their status.">Recent jobs</button>
          <button type="button" data-q="List users and teams (names only).">Users / teams</button>
        </div>
        <div class="hint-row">
          <span class="tag">Web</span>
          <button type="button" data-q="Search the web for Ansible Automation Platform MCP, then compare that to the tools you actually have.">Web vs your tools</button>
          <button type="button" data-q="Open https://docs.redhat.com and summarize how to deploy the AAP MCP server in a few bullets.">Docs: deploy MCP</button>
        </div>
        <div class="hint-row">
          <span class="tag">Write</span>
          <button type="button" data-q="Create an inventory group named chatbot-demo in inventory id 1 with description Created from sandbox starter.">Create group</button>
          <button type="button" data-q="Launch the Demo Job Template and report the job id and status.">Launch demo JT</button>
          <button type="button" data-q="Can you create a new AAP project via MCP? If not, what project tools exist?">Project create?</button>
        </div>
      </div>
      <form class="composer" id="chatForm">
        <textarea id="prompt" placeholder="Ask about AAP jobs, inventories, users… or click a starter above" rows="2"></textarea>
        <button class="primary" id="sendBtn" type="submit">Send</button>
      </form>
    </section>
  </div>

  <script>
    const AUTHED = {{AUTHED}} === true || "{{AUTHED}}" === "true";
    const EMAIL = "{{EMAIL}}";
    const login = document.getElementById("login");
    const chat = document.getElementById("chat");
    const messages = document.getElementById("messages");
    const who = document.getElementById("who");
    const loginError = document.getElementById("loginError");
    const logoutBtn = document.getElementById("logoutBtn");
    const resetBtn = document.getElementById("resetBtn");
    const sendBtn = document.getElementById("sendBtn");

    const STARTERS = [
      "What AAP MCP tools do you have, and name five that can create or change something?",
      "List job templates by name.",
      "List inventories and how many hosts each has.",
      "Search the web for Ansible Automation Platform MCP, then compare that to the tools you actually have.",
      "Create an inventory group named chatbot-demo in inventory id 1 with description Created from sandbox starter.",
      "Can you create a new AAP project via MCP? If not, what project tools exist?",
    ];

    function showAuthed(email) {
      login.classList.remove("show");
      chat.classList.add("show");
      logoutBtn.hidden = false;
      resetBtn.hidden = false;
      who.textContent = email || "signed in";
    }
    function showLogin() {
      chat.classList.remove("show");
      login.classList.add("show");
      logoutBtn.hidden = true;
      resetBtn.hidden = true;
      who.textContent = "";
      messages.innerHTML = "";
    }

    function addMessage(role, text, tools) {
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      el.textContent = text;
      if (tools && tools.length) {
        const t = document.createElement("div");
        t.className = "tools";
        t.textContent = "Tools: " + tools.map(x => `${x.server}/${x.tool}`).join(", ");
        el.appendChild(t);
      }
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
    }

    function showWelcome() {
      const wrap = document.createElement("div");
      wrap.className = "welcome-starters";
      wrap.id = "welcomeStarters";
      const p = document.createElement("p");
      p.textContent = "Signed in. Click a starter below (or use the chips under the chat) to try AAP MCP + Gemini:";
      const ol = document.createElement("ol");
      STARTERS.forEach((q) => {
        const li = document.createElement("li");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "linkish";
        btn.textContent = q;
        btn.addEventListener("click", () => {
          wrap.remove();
          sendMessage(q);
        });
        li.appendChild(btn);
        ol.appendChild(li);
      });
      wrap.appendChild(p);
      wrap.appendChild(ol);
      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.hidden = true;
      const password = document.getElementById("password").value;
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        loginError.textContent = data.detail || "Login failed";
        loginError.hidden = false;
        return;
      }
      const data = await res.json();
      showAuthed(data.email);
      showWelcome();
    });

    logoutBtn.addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      showLogin();
    });

    resetBtn.addEventListener("click", async () => {
      await fetch("/api/reset", { method: "POST" });
      messages.innerHTML = "";
      showWelcome();
    });

    async function sendMessage(text) {
      if (!text.trim()) return;
      const welcome = document.getElementById("welcomeStarters");
      if (welcome) welcome.remove();
      addMessage("user", text);
      sendBtn.disabled = true;
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          addMessage("assistant", data.detail || "Request failed");
        } else {
          addMessage("assistant", data.reply || "(empty)", data.tools_used || []);
        }
      } catch (err) {
        addMessage("assistant", String(err));
      } finally {
        sendBtn.disabled = false;
      }
    }

    document.getElementById("chatForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const box = document.getElementById("prompt");
      const text = box.value;
      box.value = "";
      await sendMessage(text);
    });

    document.querySelectorAll(".hints button").forEach((btn) => {
      btn.addEventListener("click", () => sendMessage(btn.dataset.q));
    });

    if (AUTHED) {
      showAuthed(EMAIL);
      showWelcome();
    } else {
      showLogin();
    }
  </script>
</body>
</html>
